<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        transition: 0.2s linear;
      }
    .container{
      padding: 2rem 5%;
    }
    .gallery{
      columns: 15rem 3;
      gap: 1.5rem;
    }
    img{
      margin-bottom: 1rem;
      border-radius: 0.7rem;
      width: 100%;
        display: block;
        height: 100%;
    }
    </style>
  </head>
  <body>
    <h1 style="color: red; text-align: center">
      Q). Make a responsive image gallery.
    </h1>
    <div class="container">
      <div class="gallery">
        <img src="../images/g1.jpg" alt loading="lazy"">
        <img src="../images/g2.jpg" alt loading="lazy"">
        <img src="../images/g3.jpg" alt loading="lazy"">
        <img src="../images/g4.jpg" alt loading="lazy"">
        <img src="../images/g5.jpg" alt loading="lazy"">
        <img src="../images/g6.jpg" alt loading="lazy"">
        <img src="../images/g7.jpg" alt loading="lazy"">
        <img src="../images/g8.jpg" alt loading="lazy"">
        <img src="../images/g9.jpg" alt loading="lazy"">
      </div>
    </div>
  </body>
</html>
